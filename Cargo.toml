[workspace]
resolver = "2"
members = [
    "crates/pet-core",
    "crates/pet-render",
    "crates/cat-overlay",
    "crates/cat-designer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["toru"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
png = "0.17"
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
windows = "0.58"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.pet-render]
opt-level = 3

[profile.release.package.pet-core]
opt-level = 3

[profile.release.package.cat-overlay]
opt-level = 3
